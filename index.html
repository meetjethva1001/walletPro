                </div>
            </div>
            <div class="card" style="width: 18rem;">
                <img src="./expense.jpg" class="card-img-top" alt="..." width="100%" height="150px">
                <div class="card-body">
                    <h5 class="card-title" style="text-align: center; color: rgb(255, 255, 255); font-size: 20px;"">Expenses</h5>
                        <input type="number" placeholder="Enter Expense Amount!" class="exp-amt" id="exp-amt">
                        <input type="text" placeholder="Enter Expense Category" class="exp-amt" id="exp-cat">
